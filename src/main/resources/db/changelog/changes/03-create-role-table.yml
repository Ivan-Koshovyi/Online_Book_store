databaseChangeLog:
  - changeSet:
      id: create-role-table
      author: ivankosh
      changes:
        - createTable:
            tableName: role
            ifNotExists: true
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: role
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true

  - changeSet:
      id: insert-default-roles
      author: ivankosh
      changes:
        - insert:
            tableName: role
            columns:
              - column:
                  name: role
                  value: ROLE_USER
        - insert:
            tableName: role
            columns:
              - column:
                  name: role
                  value: ROLE_ADMIN
